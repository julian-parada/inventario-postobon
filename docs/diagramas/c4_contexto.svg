  <rect x="134.4" y="472" width="141.2" height="32" fill="#fff" opacity="0.95"/>
  <text x="205" y="485" class="g b2" text-anchor="middle">Emite órdenes a</text><text x="205" y="499" class="g s" text-anchor="middle">(fuera del sistema)</text><line x1="620" y1="440" x2="770" y2="558" stroke="#707070" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fl)"/>
