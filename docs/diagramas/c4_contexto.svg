<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#707070"/></marker></defs>
 <style>.w{fill:#fff}.b{font:700 14px Arial}.s{font:11.5px Arial}.g{fill:#444}.b2{font:700 12px Arial}.t{font:700 18px Arial;fill:#1d2330}.k{font:12px Arial;fill:#555}</style><rect width="100%" height="100%" fill="#fff"/><g><circle cx="140" cy="52" r="22" fill="#08427b"/><rect x="40" y="70" width="200" height="112" rx="18" fill="#08427b"/>
  <text x="140" y="96" class="w b" text-anchor="middle">Personal de bodega</text><text x="140" y="112" class="w s" text-anchor="middle">[Persona]</text><text x="140" y="132" class="w s" text-anchor="middle">Auxiliar o jefe de bodega.</text><text x="140" y="146" class="w s" text-anchor="middle">Crea órdenes, recibe y</text><text x="140" y="160" class="w s" text-anchor="middle">registra lotes.</text></g><g><circle cx="470" cy="52" r="22" fill="#08427b"/><rect x="370" y="70" width="200" height="112" rx="18" fill="#08427b"/>
  <text x="470" y="96" class="w b" text-anchor="middle">Analista de inventario</text><text x="470" y="112" class="w s" text-anchor="middle">[Persona]</text><text x="470" y="132" class="w s" text-anchor="middle">Consulta existencias,</text><text x="470" y="146" class="w s" text-anchor="middle">vencimientos y cumplimiento</text><text x="470" y="160" class="w s" text-anchor="middle">de proveedores.</text></g><g><circle cx="810" cy="52" r="22" fill="#08427b"/><rect x="710" y="70" width="200" height="112" rx="18" fill="#08427b"/>
  <text x="810" y="96" class="w b" text-anchor="middle">Administrador de BD</text><text x="810" y="112" class="w s" text-anchor="middle">[Persona]</text><text x="810" y="132" class="w s" text-anchor="middle">Administra estructura,</text><text x="810" y="146" class="w s" text-anchor="middle">roles, respaldos y</text><text x="810" y="160" class="w s" text-anchor="middle">auditoría.</text></g><g><rect x="310" y="300" width="320" height="140" rx="8" fill="#1168bd"/><text x="470" y="328" class="w b" text-anchor="middle">Sistema de Gestión de Inventario</text>
  <text x="470" y="345" class="w s" text-anchor="middle">[Sistema de software]</text><text x="470" y="366" class="w s" text-anchor="middle">Registra catálogo, proveedores, órdenes de</text><text x="470" y="380" class="w s" text-anchor="middle">abastecimiento y lotes del centro de</text><text x="470" y="394" class="w s" text-anchor="middle">distribución Postobón Ocaña. Valida reglas y</text><text x="470" y="408" class="w s" text-anchor="middle">audita cambios.</text></g><g><rect x="20" y="560" width="250" height="120" rx="8" fill="#8a8a8a"/><text x="145" y="588" class="w b" text-anchor="middle">Proveedores</text>
  <text x="145" y="605" class="w s" text-anchor="middle">[Persona / organización externa]</text><text x="145" y="626" class="w s" text-anchor="middle">Reciben la orden de abastecimiento</text><text x="145" y="640" class="w s" text-anchor="middle">y entregan los lotes en el centro</text><text x="145" y="654" class="w s" text-anchor="middle">de distribución.</text></g><g><rect x="670" y="560" width="250" height="120" rx="8" fill="#8a8a8a"/><text x="795" y="588" class="w b" text-anchor="middle">Sistema de ventas Postobón</text>
  <text x="795" y="605" class="w s" text-anchor="middle">[Sistema de software externo]</text><text x="795" y="626" class="w s" text-anchor="middle">Define los precios; el inventario</text><text x="795" y="640" class="w s" text-anchor="middle">guarda solo un precio de</text><text x="795" y="654" class="w s" text-anchor="middle">referencia.</text></g><line x1="140" y1="186" x2="380" y2="298" stroke="#707070" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fl)"/>
